services:
  # Zookeeper (required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: futures-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - futures-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: futures-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
    networks:
      - futures-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: futures-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - futures-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    hostname: postgres
    container_name: futures-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: futures
      POSTGRES_USER: futures
      POSTGRES_PASSWORD: futures
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - futures-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futures -d futures"]
      interval: 5s
      timeout: 3s
      retries: 5

  market-data-ingestor:
    build:
      context: .
      dockerfile: apps/market-data-ingestor/Dockerfile
    container_name: futures-market-data-ingestor
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:9093
      REDIS_URL: redis://redis:6379
      SYMBOLS: BTCUSDT
      PRICE_TTL_SECONDS: "60"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - futures-network
    restart: unless-stopped

  position-api:
    build:
      context: .
      dockerfile: apps/position-api/Dockerfile
    container_name: futures-position-api
    environment:
      NODE_ENV: production
      PORT: "3001"
      KAFKA_BROKERS: kafka:9093
      REDIS_URL: redis://redis:6379
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: futures
      PGPASSWORD: futures
      PGDATABASE: futures
      SERVICE_NAME: position-api
    ports:
      - "3001:3001"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - futures-network
    restart: unless-stopped

  position-processor:
    build:
      context: .
      dockerfile: apps/position-processor/Dockerfile
    container_name: futures-position-processor
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:9093
      REDIS_URL: redis://redis:6379
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: futures
      PGPASSWORD: futures
      PGDATABASE: futures
      SERVICE_NAME: position-processor
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - futures-network
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:

networks:
  futures-network:
    driver: bridge
